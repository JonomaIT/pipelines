name: CI

# This repo's own checks: the workflows (actionlint) and the runners (the same terraform-ci the
# other repos call, used here from the local copy so a PR tests its own changes).
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: Self references at the latest version
        # The workflows call this repo's own actions by tag (deploy-app brings the runners): a
        # release that keeps an older tag there ships the older runners and contract. The newest
        # version is the first row of the README's table.
        run: |
          latest=$(sed -n 's/^| .\(v[0-9]*\.[0-9]*\.[0-9]*\). |.*/\1/p' README.md | head -1)
          stale=$(grep -rnoE 'JonomaIT/pipelines/\.github/[^@[:space:]]+@v[0-9.]+' .github | grep -v "@${latest}$" || true)
          if [ -n "$stale" ]; then
            echo "::error::Self references must be @${latest} (the README's newest version):"
            echo "$stale"
            exit 1
          fi
          echo "every self reference is @${latest}"

  terraform:
    uses: ./.github/workflows/terraform-ci.yml

  contract:
    name: contract check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tests of contract/check.py
        run: python3 -m unittest discover -s contract/tests -v
