name: terraform-ci

# Reusable. Every Terraform root of the caller repo (any folder with a versions.tf), with no cloud
# access:
#   fmt · validate · test   fmt, validate and terraform test (mocked providers); a root with
#                           env/**/*.tfvars is tested once per tfvars
#   security scan           gitleaks (secrets), TFLint (Terraform mistakes), Trivy (insecure
#                           configuration, HIGH and CRITICAL). Accepted findings are annotated in
#                           the code (#trivy:ignore:<id>, # tflint-ignore: <rule>) with the reason.
#
#   jobs:
#     terraform:
#       uses: JonomaIT/pipelines/.github/workflows/terraform-ci.yml@<tag>
on:
  workflow_call:
    inputs:
      terraform-version:
        type: string
        required: false
        default: ""
        description: Terraform version (default - the TERRAFORM_VERSION org variable)

permissions:
  contents: read

env:
  # Scanner images, pinned by version.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.21.2
  TFLINT_IMAGE: ghcr.io/terraform-linters/tflint:v0.55.1
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  terraform:
    name: fmt · validate · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version || vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Validate and test every root
        run: |
          set -euo pipefail
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          roots=$(find . -name versions.tf -not -path '*/.terraform/*' -exec dirname {} \; | sort)
          if [ -z "$roots" ]; then echo "No Terraform roots found."; exit 0; fi
          for dir in $roots; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
            if [ -d "$dir/tests" ]; then
              vars=""
              if [ -d "$dir/env" ]; then
                vars=$(cd "$dir" && find env -name '*.tfvars' | sort)
              fi
              if [ -n "$vars" ]; then
                for f in $vars; do echo "--- $f"; terraform -chdir="$dir" test -var-file="$f"; done
              else
                terraform -chdir="$dir" test
              fi
            fi
            echo "::endgroup::"
          done

  scan:
    name: security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the whole history

      - name: gitleaks (secrets in code and history)
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" detect --source /repo --redact --no-banner

      - name: TFLint
        run: docker run --rm -v "$PWD:/data" -w /data "$TFLINT_IMAGE" --recursive --format compact

      - name: Trivy (HIGH, CRITICAL)
        run: docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" config --quiet --severity HIGH,CRITICAL --exit-code 1 /src
