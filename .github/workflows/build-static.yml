name: build-static

# Reusable. Builds a static site (runtime cloudfront, web-*) the same way for every repo: the
# package.json scripts are the interface (lint, typecheck, test, build), Node comes from .nvmrc and
# dependencies only from the lockfile. Trivy scans the dependencies first (HIGH and CRITICAL with a
# fix fail). On main the built folder is kept as the `site` artifact, which the deploy uploads.
# No cloud access.
#
#   jobs:
#     site:
#       uses: JonomaIT/pipelines/.github/workflows/build-static.yml@<tag>
on:
  workflow_call:
    inputs:
      output-dir:
        type: string
        required: false
        default: dist
        description: Folder the build writes (source_dir in deploy/app.hcl)

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  site:
    name: lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only contract fields in deploy/, none of the platform's, name = repo name (ADR-014).
      - name: App contract
        uses: JonomaIT/pipelines/.github/actions/contract-check@v2.2.0

      - name: Trivy (dependencies, HIGH and CRITICAL with a fix)
        run: |
          docker run --rm -v "$PWD/package-lock.json:/src/package-lock.json:ro" "$TRIVY_IMAGE" \
            fs --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src/package-lock.json

      - name: Node (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          OUTPUT_DIR: ${{ inputs.output-dir }}
        run: |
          npm run build
          test -f "$OUTPUT_DIR/index.html" || { echo "::error::the build did not write $OUTPUT_DIR/index.html"; exit 1; }
          {
            echo "### Site"
            echo "\`$OUTPUT_DIR/\`: $(find "$OUTPUT_DIR" -type f | wc -l) files, $(du -sh "$OUTPUT_DIR" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the site (main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ${{ inputs.output-dir }}
          if-no-files-found: error
          retention-days: 7
