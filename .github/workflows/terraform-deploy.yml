name: terraform-deploy

# Reusable. Plans and applies the Terraform components of the caller repo: one plan per
# component × account × region, found from the tfvars files.
#
#   <component>/env/<account>/<region>.tfvars   regional       key <account>/<region>/<component>
#   global/<name>/env/<account>.tfvars          global         key <account>/global/<name>
#   cross-region/<name>/env/<account>.tfvars    cross-region   key <account>/cross-region/<name>
#
#   pull request   plan of what changed (read-only role) + the plans as a PR comment; "Plan result"
#                  fails if any plan fails (make it a required check)
#   main, manual   1. plan of every target, in parallel (read-only role), shown in the run summary
#                  2. ONE approval per account (GitHub Environment), looking at those plans
#                  3. apply of exactly those saved plans, in order; a target whose plan needed an
#                     earlier target of the same run (e.g. ecs-cluster before its VPC exists) is
#                     planned again at apply time, and that plan is shown in the summary
#                  manual runs can pick a target and destroy (reverse order); a destroy of
#                  everything skips the persistent components (only an explicit target removes them)
#   drift          (schedule) plan of everything that is deployed; changes open or update an issue
#
# Conventions it relies on:
#   - backends/<account>.tfbackend in the caller repo (state bucket of the account);
#   - AWS_ACCOUNT_IDS org variable, JSON {"<account>": "<id>"}: accounts not listed (not
#     bootstrapped yet) are skipped;
#   - roles from organization/bootstrap: github-actions-<repo>-plan (read-only; pull requests and
#     main) and github-actions-<repo> (write; only inside the account's GitHub Environment).
#
#   jobs:
#     deploy:
#       uses: JonomaIT/pipelines/.github/workflows/terraform-deploy.yml@<tag>
#       with:
#         order: network ecs-cluster alb-shared
#       secrets:
#         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
on:
  workflow_call:
    inputs:
      order:
        type: string
        required: true
        description: Components in apply order, space-separated; components not listed are never run
      target:
        type: string
        required: false
        default: ""
        description: Manual runs - a component (every tfvars of it) or one tfvars path; empty = all
      destroy:
        type: boolean
        required: false
        default: false
        description: Manual runs - destroy the targets, in reverse order
      persistent:
        type: string
        required: false
        default: ""
        description: Components a destroy of everything leaves alone (space-separated); only a destroy that targets them removes them
      drift:
        type: boolean
        required: false
        default: false
        description: Drift check - plan everything deployed, report changes in an issue, never apply
      primary-region:
        type: string
        required: false
        default: ""
        description: Applied before the other regions of the same component (default - the PRIMARY_REGION org variable)
      terraform-version:
        type: string
        required: false
        default: ""
        description: Terraform version (default - the TERRAFORM_VERSION org variable)
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
        description: Only for components that use the Cloudflare provider

permissions:
  contents: read
  id-token: write      # OIDC with AWS
  pull-requests: write # plan comment
  issues: write        # drift issue

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # The platform's identity, from org variables (one place for a whole platform): every component
  # gets var.prefix, and the state of account <a> lives in <prefix>-<a>-tfstate, in STATE_REGION.
  TF_VAR_prefix: ${{ vars.PROJECT_PREFIX }}
  STATE_REGION: ${{ vars.STATE_REGION }}
  PRIMARY_REGION: ${{ inputs.primary-region || vars.PRIMARY_REGION }}

jobs:
  targets:
    name: Targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      accounts: ${{ steps.find.outputs.accounts }}
      targets: ${{ steps.find.outputs.targets }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find targets
        id: find
        shell: python
        env:
          EVENT: ${{ inputs.drift && 'schedule' || github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ORDER: ${{ inputs.order }}
          TARGET: ${{ inputs.target }}
          DESTROY: ${{ inputs.destroy }}
          PERSISTENT: ${{ inputs.persistent }}
          ACCOUNTS: ${{ vars.AWS_ACCOUNT_IDS }}
        run: |
          import glob
          import json
          import os
          import subprocess

          # Inputs (environment): EVENT, BASE, HEAD, ORDER, TARGET, DESTROY, PERSISTENT, PRIMARY_REGION, ACCOUNTS.
          order = os.environ["ORDER"].split()
          accounts = json.loads(os.environ.get("ACCOUNTS") or "{}")
          event = os.environ["EVENT"]
          target = os.environ.get("TARGET", "").strip().strip("/")
          destroy = os.environ.get("DESTROY") == "true"
          persistent = set(os.environ.get("PERSISTENT", "").split())
          primary = os.environ.get("PRIMARY_REGION", "")

          # The platform's identity lives in org variables; without it nothing can be named.
          missing = [v for v, k in (("PROJECT_PREFIX", "TF_VAR_prefix"), ("STATE_REGION", "STATE_REGION"), ("PRIMARY_REGION", "PRIMARY_REGION")) if not os.environ.get(k)]
          if missing:
              print(f"::error::Org variables missing: {', '.join(missing)} (Settings → Secrets and variables → Actions → Variables).")
              raise SystemExit(1)


          def tfvars_of(component):
              return sorted(glob.glob(f"{component}/env/**/*.tfvars", recursive=True))


          def component_of(path):
              """Longest component in the order that contains the path (None = not a component)."""
              hits = [c for c in order if path == c or path.startswith(c + "/")]
              return max(hits, key=len) if hits else None


          def describe(path):
              component, rest = path.split("/env/", 1)
              parts = rest[: -len(".tfvars")].split("/")
              account = parts[0]
              if len(parts) == 2:  # env/<account>/<region>.tfvars: regional
                  region = parts[1]
                  key = f"{account}/{region}/{component}"
              else:  # env/<account>.tfvars: global/<name> or cross-region/<name>
                  kind, name = component.split("/", 1)
                  region = kind
                  key = f"{account}/{kind}/{name}"
              return {
                  "name": f"{component} · {account} · {region}",
                  "component": component,
                  "tfvars": "env/" + rest,
                  "account": account,
                  "account_id": accounts.get(account, ""),
                  "region": region,
                  "key": key,
                  "slug": key.replace("/", "__"),
              }


          selected = set()
          if event in ("workflow_dispatch", "schedule"):
              if not target:
                  for c in order:
                      if destroy and c in persistent:
                          print(f"::notice::{c}: persistent, a destroy of everything leaves it (target it to remove it)")
                          continue
                      selected.update(tfvars_of(c))
              elif target.endswith(".tfvars"):
                  selected.add(target)
              else:
                  selected.update(tfvars_of(target))
          else:
              base, head = os.environ["BASE"], os.environ["HEAD"]
              if not base or set(base) == {"0"}:  # first push of a branch: everything
                  changed = [p for c in order for p in glob.glob(f"{c}/**", recursive=True)]
              else:
                  rng = f"{base}...{head}" if event == "pull_request" else f"{base}..{head}"
                  changed = subprocess.run(["git", "diff", "--name-only", rng], check=True,
                                           capture_output=True, text=True).stdout.split()
              for path in changed:
                  component = component_of(path)
                  if not component:
                      continue
                  if path.startswith(component + "/env/") and path.endswith(".tfvars"):
                      if os.path.exists(path):  # a deleted tfvars has nothing to plan
                          selected.add(path)
                  else:  # code of the component: every account and region using it
                      selected.update(tfvars_of(component))

          targets = []
          for path in sorted(selected):
              t = describe(path)
              if t["component"] not in order:
                  print(f"::warning::{path}: component not in the deploy order, skipped")
                  continue
              if not t["account_id"]:
                  print(f"::notice::{path}: account {t['account']} not in AWS_ACCOUNT_IDS (not bootstrapped), skipped")
                  continue
              targets.append(t)

          # Apply order: components in the given order, primary region first (e.g. its ACM validation
          # record serves the other regions). Destroy runs the exact reverse.
          targets.sort(key=lambda t: (order.index(t["component"]), t["account"], t["region"] != primary, t["region"]))
          if destroy:
              targets.reverse()

          # One apply job per account (one approval each), running that account's targets in order.
          accts = []
          for t in targets:
              if t["account"] not in [a["account"] for a in accts]:
                  accts.append({"account": t["account"], "account_id": t["account_id"]})

          with open(os.environ.get("GITHUB_OUTPUT", "/dev/stdout"), "a") as out:
              out.write(f"matrix={json.dumps({'include': targets})}\n")
              out.write(f"accounts={json.dumps({'include': accts})}\n")
              out.write(f"targets={json.dumps(targets)}\n")
              out.write(f"count={len(targets)}\n")
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout"), "a") as summary:
              summary.write(f"### {'Destroy' if destroy else 'Targets'} ({len(targets)})\n\n| # | Component | Account | Region | State key |\n|---|---|---|---|---|\n")
              for i, t in enumerate(targets, 1):
                  summary.write(f"| {i} | `{t['component']}` | {t['account']} | {t['region']} | `{t['key']}` |\n")

  # Read-only plan of every target, in parallel. A target never deployed that cannot be planned
  # alone (it reads something an earlier target creates) is "blocked": not an error, it is planned
  # at apply time. On main no plan blocks the apply job, which plans again what has no saved plan.
  plan:
    name: Plan · ${{ matrix.name }}
    needs: targets
    if: needs.targets.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version || vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: AWS credentials (read-only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account_id }}:role/github-actions-${{ github.event.repository.name }}-plan
          aws-region: ${{ env.PRIMARY_REGION }}

      - name: Terraform init
        run: terraform init -backend-config="bucket=$TF_VAR_prefix-${{ matrix.account }}-tfstate" -backend-config="region=$STATE_REGION" -backend-config="key=${{ matrix.key }}"

      - name: Terraform plan
        env:
          EVENT: ${{ github.event_name }}
          DRIFT: ${{ inputs.drift }}
          DESTROY_FLAG: ${{ inputs.destroy && '-destroy' || '' }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/out/${{ matrix.slug }}"; mkdir -p "$out"
          # No state file yet (never applied) makes "state list" fail: that also means not deployed.
          deployed=$(terraform state list 2>/dev/null | head -n1 || true)
          # Only a manual run creates a component. A push or a pull request changes what is
          # deployed and never brings up what is not (e.g. the lab, torn down to save money); the
          # drift check has nothing to compare.
          if [ -z "$deployed" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "not-deployed" > "$out/status"
            if [ "$DRIFT" = "true" ]; then echo "Not deployed: nothing to compare."
            else echo "::notice title=${{ matrix.name }}::not deployed: left as it is (only a manual run, Actions → Deploy → Run workflow, creates it)"; fi
            exit 0
          fi
          set +e # -detailed-exitcode: 0 no changes, 1 error, 2 changes
          # shellcheck disable=SC2086
          terraform plan -lock-timeout=5m -no-color -detailed-exitcode -var-file="${{ matrix.tfvars }}" $DESTROY_FLAG -out=tfplan
          rc=$?
          set -e
          case $rc in
            0) echo "no-changes" > "$out/status" ;;
            2) echo "changes" > "$out/status" ;;
            *)
              # Never deployed and unable to plan alone: it reads something another target creates
              # (e.g. ecs-cluster needs the VPC). Not a code error (validate and tests cover that):
              # it is planned at apply time, after the target it depends on.
              if [ -z "$deployed" ] && [ "$DRIFT" != "true" ]; then
                echo "blocked" > "$out/status"
                echo "::notice title=${{ matrix.name }}::not deployed yet and depends on another target: planned at apply time"
                exit 0
              fi
              echo "failed" > "$out/status"; exit "$rc" ;;
          esac
          # Only runs that apply keep the plan file (artifacts live 1 day; secrets never go
          # through Terraform variables, they stay in Secrets Manager).
          if [ "$EVENT" != "pull_request" ] && [ "$DRIFT" != "true" ]; then cp tfplan "$out/tfplan"; fi

      - name: Plan summary
        if: always()
        run: |
          out="$RUNNER_TEMP/out/${{ matrix.slug }}"; mkdir -p "$out"
          [ -f "$out/status" ] || echo "failed" > "$out/status"
          {
            echo "#### ${{ matrix.name }} · $(cat "$out/status")"
            echo '```'
            if [ -f tfplan ]; then terraform show -no-color tfplan | grep -E '^\s+# |^Plan:|^No changes' || true
            elif grep -q not-deployed "$out/status"; then echo "not deployed: left as it is (only a manual run creates it)"
            elif grep -q blocked "$out/status"; then echo "not deployed yet; depends on another target: planned at apply time"
            else echo "no plan (see the job log)"; fi
            echo '```'
          } > "$out/summary.md"
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"

      # The files go inside a folder named after the target: whether the download extracts one
      # artifact or several, the consumers find them by that name.
      - name: Keep the plan for the apply
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ matrix.slug }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/
          retention-days: 1

  # Stable name for a required check, and the plans as a single (updated) PR comment.
  result:
    name: Plan result
    needs: [targets, plan]
    if: always() && !inputs.drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect plans
        if: needs.targets.outputs.count != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plan-*
          path: plans-all

      # "Re-run failed jobs" keeps the earlier attempt's artifacts in the run, under other names
      # (-a<attempt>). Copied oldest first, so each target ends with its latest plan.
      - name: Latest plan of each target
        if: needs.targets.outputs.count != '0'
        run: |
          mkdir -p plans
          dirs=$(find plans-all -mindepth 1 -maxdepth 1 -type d -name 'plan-*' 2>/dev/null | sort -V)
          # A single artifact may be extracted without its own folder: the targets are right there.
          if [ -z "$dirs" ] && [ -d plans-all ]; then cp -r plans-all/. plans/; fi
          for d in $dirs; do cp -r "$d"/. plans/; done

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          COUNT: ${{ needs.targets.outputs.count }}
        run: |
          marker='<!-- terraform-deploy -->'
          {
            echo "$marker"
            echo "## Terraform plan"
            if [ "$COUNT" = "0" ]; then echo "No component changed: nothing to plan."; fi
            find plans -name summary.md 2>/dev/null | sort | while read -r f; do cat "$f"; echo; done
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_"
          } > comment.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate -q ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md >/dev/null
          else gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md >/dev/null; fi

      - name: Result
        env:
          TARGETS: ${{ needs.targets.result }}
          PLAN: ${{ needs.plan.result }}
        run: |
          echo "targets: $TARGETS · plan: $PLAN"
          [ "$TARGETS" = "success" ] && { [ "$PLAN" = "success" ] || [ "$PLAN" = "skipped" ]; }

  # One job (one approval) per account; production waits for a required reviewer. The write role
  # only trusts jobs inside the account's GitHub Environment.
  apply:
    name: ${{ inputs.destroy && 'Destroy' || 'Apply' }} · ${{ matrix.account }}
    needs: [targets, plan]
    # !cancelled(), not always(): a cancelled run must not reach the approval gate.
    if: ${{ !cancelled() && !inputs.drift && github.event_name != 'pull_request' && needs.targets.result == 'success' && needs.targets.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ matrix.account }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.accounts) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version || vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: AWS credentials (write)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account_id }}:role/github-actions-${{ github.event.repository.name }}
          aws-region: ${{ env.PRIMARY_REGION }}

      - name: Reviewed plans
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plan-*
          path: plans-all

      # "Re-run failed jobs" keeps the earlier attempt's artifacts in the run, under other names
      # (-a<attempt>). Copied oldest first, so each target ends with its latest plan.
      - name: Latest plan of each target
        if: success()
        run: |
          mkdir -p plans
          dirs=$(find plans-all -mindepth 1 -maxdepth 1 -type d -name 'plan-*' 2>/dev/null | sort -V)
          # A single artifact may be extracted without its own folder: the targets are right there.
          if [ -z "$dirs" ] && [ -d plans-all ]; then cp -r plans-all/. plans/; fi
          for d in $dirs; do cp -r "$d"/. plans/; done

      - name: Apply in order
        env:
          TARGETS: ${{ needs.targets.outputs.targets }}
          ACCOUNT: ${{ matrix.account }}
          DESTROY_FLAG: ${{ inputs.destroy && '-destroy' || '' }}
        run: |
          set -euo pipefail
          while read -r t; do
            name=$(jq -r .name <<<"$t"); comp=$(jq -r .component <<<"$t"); key=$(jq -r .key <<<"$t")
            tfvars=$(jq -r .tfvars <<<"$t"); slug=$(jq -r .slug <<<"$t")
            saved=$(find "$GITHUB_WORKSPACE/plans" -path "*/$slug/tfplan" 2>/dev/null | head -n1)
            status_file=$(find "$GITHUB_WORKSPACE/plans" -path "*/$slug/status" 2>/dev/null | head -n1)
            if [ -n "$status_file" ] && grep -q not-deployed "$status_file"; then
              echo "::notice title=$name::not deployed: left as it is (only a manual run creates it)"
              echo "#### $name · not deployed, left as it is" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            echo "::group::$name"
            (
              cd "$comp"
              terraform init -reconfigure -backend-config="bucket=$TF_VAR_prefix-$ACCOUNT-tfstate" -backend-config="region=$STATE_REGION" -backend-config="key=$key"
              if [ -n "$saved" ] && [ -f "$saved" ]; then
                echo "Applying the reviewed plan."
                plan="$saved"; how="reviewed plan"
              else
                echo "No reviewed plan (it needed a target applied earlier in this run): planning now."
                # shellcheck disable=SC2086
                terraform plan -lock-timeout=5m -no-color -var-file="$tfvars" $DESTROY_FLAG -out=tfplan
                plan=tfplan; how="planned at apply time"
              fi
              {
                echo "#### $name · $how"
                echo '```'
                terraform show -no-color "$plan" | grep -E '^\s+# |^Plan:|^No changes' || true
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              # Exactly this plan; if the state changed since it was made, Terraform refuses it.
              terraform apply -lock-timeout=5m -no-color "$plan"
            )
            echo "::endgroup::"
          done < <(jq -c --arg a "$ACCOUNT" '.[] | select(.account == $a)' <<<"$TARGETS")

  # Drift: changes in deployed components open (or update) one issue; a clean run closes it.
  drift:
    name: Drift report
    needs: [targets, plan]
    if: ${{ !cancelled() && inputs.drift }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect plans
        if: needs.targets.outputs.count != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plan-*
          path: plans-all

      # "Re-run failed jobs" keeps the earlier attempt's artifacts in the run, under other names
      # (-a<attempt>). Copied oldest first, so each target ends with its latest plan.
      - name: Latest plan of each target
        if: needs.targets.outputs.count != '0'
        run: |
          mkdir -p plans
          dirs=$(find plans-all -mindepth 1 -maxdepth 1 -type d -name 'plan-*' 2>/dev/null | sort -V)
          # A single artifact may be extracted without its own folder: the targets are right there.
          if [ -z "$dirs" ] && [ -d plans-all ]; then cp -r plans-all/. plans/; fi
          for d in $dirs; do cp -r "$d"/. plans/; done

      - name: Open, update or close the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          title="Terraform drift detected"
          drifted=""; failed=""
          while read -r st; do
            d=$(dirname "$st")
            case $(cat "$st") in
              changes) drifted="$drifted $d" ;;
              failed) failed="$failed $d" ;;
            esac
          done < <(find plans -name status 2>/dev/null | sort)
          {
            echo "Deployed components whose real state differs from the code (someone changed something outside Terraform, or a merge was not applied)."
            echo
            for d in $drifted $failed; do cat "$d/summary.md"; echo; done
            echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_"
          } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$drifted$failed" ]; then
            if [ -n "$issue" ]; then gh issue comment "$issue" --body-file body.md
            else gh issue create --title "$title" --body-file body.md; fi
            echo "::warning::Drift or failed plan in:$drifted$failed"
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "No drift on $(date -u +%F): closing."
          fi
