name: build-push

# Reusable. Builds the app image from the repo's Dockerfile and scans it with Trivy (HIGH and
# CRITICAL with a fix available fail the build). On main it pushes it to the platform registry
# (ECR in shared-services), tagged with the commit SHA: built once, promoted to every account and
# region (the registry replicates it). Pull requests only build and scan.
#
# Conventions: repository = repo name (created by infrastructure/ecr); push role
# github-actions-ecr-push in shared-services (organization/bootstrap, main only); account ID from
# the AWS_ACCOUNT_IDS org variable.
#
#   jobs:
#     image:
#       uses: JonomaIT/pipelines/.github/workflows/build-push.yml@<tag>
on:
  workflow_call:
    inputs:
      context:
        type: string
        required: false
        default: "."
        description: Docker build context
      registry-region:
        type: string
        required: false
        default: us-east-1
        description: Primary region of the registry
    outputs:
      image:
        description: Pushed image (empty on pull requests)
        value: ${{ jobs.image.outputs.image }}

permissions:
  contents: read
  id-token: write # OIDC with AWS (push role)

env:
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  image:
    name: build · scan · push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      APP: ${{ github.event.repository.name }}
      LOCAL_TAG: ${{ github.event.repository.name }}:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: docker build --pull --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$LOCAL_TAG" "${{ inputs.context }}"

      - name: Trivy (HIGH, CRITICAL with a fix)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$LOCAL_TAG"

      - name: AWS credentials (push)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ fromJSON(vars.AWS_ACCOUNT_IDS)['shared-services'] }}:role/github-actions-ecr-push
          aws-region: ${{ inputs.registry-region }}

      - name: Push
        id: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ fromJSON(vars.AWS_ACCOUNT_IDS)['shared-services'] }}.dkr.ecr.${{ inputs.registry-region }}.amazonaws.com
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          image="$REGISTRY/$APP:$GITHUB_SHA"
          docker tag "$LOCAL_TAG" "$image"
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo "### Image"
            echo '```'
            echo "$image"
            echo '```'
            echo "Deploy: \`-var image=$image\` (each region pulls from its own replica)."
          } >> "$GITHUB_STEP_SUMMARY"
