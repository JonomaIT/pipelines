name: dependabot-auto-merge

# Reusable. Dependabot pull requests merge themselves when they are safe:
#   patch and minor (every dependency in the PR)   merge (squash) once the required checks of the
#                                                  repo's ruleset pass
#   any major, or an update type it cannot read    label dependabot:manual, waits for a person
# The update types come from the "updated-dependencies" metadata Dependabot writes in its commit
# message (the same data dependabot/fetch-metadata reads), so no third-party action is needed.
#
# Which GitHub App merges (never GITHUB_TOKEN: a merge through it starts no workflow, so the push to
# main would not deploy nor release). Dependabot-triggered runs only see org **Dependabot** secrets.
#   repo whose main needs no review   jonomait-release: turns on auto-merge, GitHub merges when
#                                     the checks pass. Secret RELEASE_APP_PRIVATE_KEY.
#   repo whose main needs a review    jonomait-dependabot, a bypass actor of the main ruleset
#   (apps: code owners)               (organization, global/github): waits for the required checks,
#                                     then merges without the review. Its key exists only as a
#                                     Dependabot secret, so no other workflow can use the bypass.
#                                     Secret DEPENDABOT_APP_PRIVATE_KEY, variable
#                                     DEPENDABOT_APP_CLIENT_ID. Without them the PR waits for the
#                                     review, with auto-merge on.
#
#   on:
#     pull_request:
#       branches: [main]
#   permissions:
#     contents: read
#   jobs:
#     dependabot:
#       if: github.actor == 'dependabot[bot]'
#       uses: JonomaIT/pipelines/.github/workflows/dependabot-auto-merge.yml@<tag>
#       secrets:
#         RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
#         DEPENDABOT_APP_PRIVATE_KEY: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }} # repos with reviews
on:
  workflow_call:
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true
        description: Private key of the jonomait-release app (org Dependabot secret)
      DEPENDABOT_APP_PRIVATE_KEY:
        required: false
        description: Private key of the jonomait-dependabot app (org Dependabot secret only), for repos whose main needs a review

permissions:
  contents: read

jobs:
  auto-merge:
    name: auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Waiting for the required checks (image build and scan, site build) is the long part.
    timeout-minutes: 60
    env:
      HAS_DEPENDABOT_APP: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY != '' && vars.DEPENDABOT_APP_CLIENT_ID != '' }}
    steps:
      # Public data only: the SHA256 fingerprint of each key, the same value GitHub lists under the
      # app's "Private keys". If a token step fails with "JSON web token could not be decoded",
      # compare it there: the key in Dependabot secrets is not one of that app's keys.
      - name: Key fingerprints (compare with each app's Private keys)
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          DEPENDABOT_KEY: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}
        run: |
          fingerprint() {
            if [ -z "$2" ]; then echo "$1: not set"; return; fi
            if printf '%s\n' "$2" | openssl pkey -pubout -outform DER -out pub.der 2>/dev/null; then
              echo "$1: SHA256:$(openssl dgst -sha256 -binary pub.der | openssl base64 -A)"
            else
              echo "$1: not a valid private key ($(printf '%s\n' "$2" | wc -l) lines)"
            fi
            rm -f pub.der
          }
          fingerprint "jonomait-release (RELEASE_APP_PRIVATE_KEY)" "$RELEASE_KEY"
          fingerprint "jonomait-dependabot (DEPENDABOT_APP_PRIVATE_KEY)" "$DEPENDABOT_KEY"

      - name: App token (jonomait-release)
        id: release
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # Dependabot also bumps actions inside .github/workflows: merging those needs it.
          permission-workflows: write

      - name: Patch and minor, or major?
        id: kind
        env:
          GH_TOKEN: ${{ steps.release.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          types=$(gh api "repos/$GH_REPO/pulls/$PR/commits" --jq '.[].commit.message' \
            | grep -oE 'update-type: version-update:semver-[a-z]+' | sed 's/.*semver-//' | sort -u || true)
          echo "update types: ${types:-none}"
          if [ -z "$types" ] || grep -qvE '^(patch|minor)$' <<<"$types"; then
            gh label create dependabot:manual --color B60205 \
              --description "Dependabot update with a major (or unknown) version: merge by hand" 2>/dev/null || true
            gh pr edit "$PR" --add-label dependabot:manual
            gh pr merge "$PR" --disable-auto 2>/dev/null || true
            echo "::notice::#$PR has a major (or unknown) update: it waits for a person."
            echo "safe=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "safe=true" >>"$GITHUB_OUTPUT"
          echo "types=$(tr '\n' ' ' <<<"$types")" >>"$GITHUB_OUTPUT"
          # Does main ask for an approval? (rules that apply to main, from every ruleset)
          approvals=$(gh api "repos/$GH_REPO/rules/branches/${{ github.base_ref }}" \
            --jq '[.[] | select(.type == "pull_request") | .parameters.required_approving_review_count] | max // 0')
          echo "approvals=$approvals" >>"$GITHUB_OUTPUT"
          echo "main needs $approvals approval(s)"

      - name: Auto-merge (no review needed, or no bypass app)
        if: steps.kind.outputs.safe == 'true' && (steps.kind.outputs.approvals == '0' || env.HAS_DEPENDABOT_APP != 'true')
        env:
          GH_TOKEN: ${{ steps.release.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TYPES: ${{ steps.kind.outputs.types }}
          APPROVALS: ${{ steps.kind.outputs.approvals }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --auto --squash
          if [ "$APPROVALS" = "0" ]; then
            echo "::notice::#$PR ($TYPES) merges itself when the required checks pass."
          else
            echo "::warning::#$PR ($TYPES): main needs a review and DEPENDABOT_APP_PRIVATE_KEY / DEPENDABOT_APP_CLIENT_ID are not set; it merges after the approval."
          fi

      - name: App token (jonomait-dependabot)
        id: dependabot
        if: steps.kind.outputs.safe == 'true' && steps.kind.outputs.approvals != '0' && env.HAS_DEPENDABOT_APP == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DEPENDABOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read

      - name: Wait for the required checks, merge without the review
        if: steps.dependabot.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.dependabot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TYPES: ${{ steps.kind.outputs.types }}
        run: |
          set -euo pipefail
          # The bypass skips the whole ruleset, checks included: this wait is what keeps them.
          # Fails (and does not merge) as soon as a required check fails.
          gh pr checks "$PR" --required --watch --fail-fast --interval 30
          # Merge exactly the commit whose checks passed: a newer push gets its own run.
          gh api -X PUT "repos/$GH_REPO/pulls/$PR/merge" -f merge_method=squash -f sha="$HEAD" >/dev/null
          echo "::notice::#$PR ($TYPES) merged by jonomait-dependabot after the required checks passed."
