name: deploy-app

# Reusable. Deploys an app to one account from its deploy/ files, with the runners of this repo
# (the deploy-app action, at this workflow's tag):
#
#   ecs          data (deploy/data.hcl) → the app in each region of deploy/env/<account>.tfvars,
#                primary first → tests/smoke/*.hurl against the public names
#   cloudfront   the site's infrastructure → the files of the site artifact → invalidation
#   destroy      the reverse, data last (only where the platform allows destroying data)
#
# Every step plans, shows the plan in the run summary and applies exactly that plan.
#
# Conventions it relies on:
#   - the image, for ecs: pushed by build-push in the same run, tagged with the commit SHA;
#   - the site, for cloudfront: the "site" artifact of build-static in the same run;
#   - state bucket jonomait-<account>-tfstate; keys <account>/cross-region/data/<app>,
#     <account>/<region>/apps/<app>, <account>/global/apps/<app>;
#   - AWS_ACCOUNT_IDS org variable; role github-actions-<repo> in the account (organization
#     bootstrap), which only trusts jobs inside the account's GitHub Environment.
#
# Not yet (ADR-014, step 3): a role that trusts only this workflow (job_workflow_ref), the plan
# shown before the approval, production approved by a second person, a permissions boundary.
#
#   jobs:
#     deploy:
#       needs: image
#       uses: JonomaIT/pipelines/.github/workflows/deploy-app.yml@<tag>
#       secrets:
#         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_JONOMA }}
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: false
        default: production
        description: The account to deploy to (deploy/env/<account>.tfvars, GitHub Environment)
      destroy:
        type: boolean
        required: false
        default: false
        description: Remove the app from the account instead (reverse order, data last)
      terraform-version:
        type: string
        required: false
        default: ""
        description: Terraform version (default - the TERRAFORM_VERSION org variable)
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
        description: Public names of the app (Cloudflare DNS)

permissions:
  contents: read
  id-token: write # OIDC with AWS

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  deploy:
    name: ${{ inputs.destroy && 'destroy' || 'deploy' }} · ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    # One deploy per app and account at a time; a newer one waits instead of cancelling an apply.
    concurrency:
      group: deploy-app-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: App contract
        uses: JonomaIT/pipelines/.github/actions/contract-check@v2.5.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version || vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: AWS credentials (write)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ fromJSON(vars.AWS_ACCOUNT_IDS)[inputs.environment] }}:role/github-actions-${{ github.event.repository.name }}
          aws-region: us-east-1

      - name: Site (static apps)
        if: ${{ !inputs.destroy && hashFiles('package.json') != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site

      - name: Deploy
        uses: JonomaIT/pipelines/.github/actions/deploy-app@v2.5.0
        with:
          environment: ${{ inputs.environment }}
          destroy: ${{ inputs.destroy }}
          image-tag: ${{ github.sha }}
          registry-account: ${{ fromJSON(vars.AWS_ACCOUNT_IDS)['shared-services'] }}
          site-dir: ${{ runner.temp }}/site
